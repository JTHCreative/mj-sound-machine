<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MJ Sound Machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>MJ Sound Machine</h1>
      <p class="subtitle">
        Tap pads to play. Hold or mash several at once to layer them up.
      </p>
      <div id="auth-bar" class="auth-bar" hidden>
        <span id="auth-status" class="auth-status"></span>
        <button id="auth-button" class="auth-button" type="button"></button>
      </div>
    </header>

    <main>
      <div id="pad-grid" class="pad-grid" aria-label="Sound pads"></div>

      <section class="hint">
        <p>
          <strong>Tip:</strong> drag a small audio file (.mp3, .wav, .ogg —
          under 500 KB) onto any pad to replace its sound. Right-click a pad
          to rename it. Press and hold a pad for 5 seconds to reset.
        </p>
        <p id="storage-hint" class="storage-hint"></p>
        <p class="keys">
          Keyboard: <kbd>1</kbd>-<kbd>9</kbd> <kbd>0</kbd> <kbd>-</kbd>
          <kbd>=</kbd>
        </p>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
